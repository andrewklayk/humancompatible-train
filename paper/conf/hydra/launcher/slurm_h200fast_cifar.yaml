# H200 Slurm launcher for paper/tune.py multirun, via the hydra-submitit-launcher plugin.
# By analogy with benchmark/new_bench/conf/hydra/launcher/slurm_h200.yaml; the difference
# is that `setup:` is FILLED IN here, because E3-LM needs the PyTorch module and the
# transformers venv and a compute node has neither by default.
#
#   # from a LOGIN node -- this submits, it does not compute:
#   python paper/tune.py -m hydra/launcher=slurm_h200 +sweep=e3_llm_nupi \
#       ++experiment.tokens=$PWD/paper/results/e3/tokens.npy
#
# This is the launcher that makes multirun actually parallel: one array task per sweep
# cell, up to `array_parallelism` at a time. Without it Hydra uses BasicLauncher and the
# cells run one after another in a single process -- which is what paper/sbatch_tune.sh
# deliberately does inside one allocation.
#
# `++experiment.tokens` must be ABSOLUTE and must be passed. tune.py redirects the
# artifact root at each job's own output directory before run_llm resolves its default
# shard path, so `tokens: null` makes every task look for the shard inside its own job
# directory and fail. Same trap paper/sbatch_tune.sh works around.
defaults:
  - submitit_slurm

# --- resources (edit for your cluster) ---
partition: h200fast
tasks_per_node: 1
cpus_per_task: 8
mem_per_cpu: 12G
timeout_min: 180

additional_parameters:
  gres: "gpu:1"
array_parallelism: 16

setup:
  - "export HF_HUB_OFFLINE=1"
  - "export TOKENIZERS_PARALLELISM=false"
