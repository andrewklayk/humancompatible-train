# penalty=0 is the published nuPI; penalty=1 is what E0a recommends, and the difference is
# an E0a finding worth re-testing -- so sweep `algorithm.dual.penalty` alongside ki/kp.
name: nupi
label: "nuPI"
method: null            # commented out of run_llm.METHODS
primal:
  lr: 1.0e-3
dual:
  _target_: humancompatible.train.dual_optim.nuPI
  _partial_: true
  ki: 0.05
  kp: 0.05
  nu: 0.01
  penalty: 1.0
  is_ineq: true
