# Stochastic penalty-barrier method: PBM driven through its penalty-barrier function,
# which `pbf` selects. There is no separate SPBM class in
# `humancompatible.train.dual_optim`; `_target_` is PBM and this block is the
# parameterisation, which is the whole point of the `dual:` spec being live.
#
# `method: pbm` only names the registry entry run_llm records in the summary's `method`
# column. The dual itself comes from this block -- with a factory present the registry is
# bypassed entirely -- so run_llm.METHODS["pbm"]'s own defaults are NOT used here. The
# row's own label is `label` below.
#
# Annealing off explicitly: both flags default on and then make `epoch_length` mandatory,
# so a bare PBM(m=...) raises. Note PBM's `dual_range` floor makes lambda=0
# unrepresentable -- a structural limit E0a measured, not a tuning artifact.
name: spbm
label: "SPBM"
method: pbm
primal:
  lr: 1.0e-3
dual:
  _target_: humancompatible.train.dual_optim.PBM
  _partial_: true
  pbf: quadratic_logarithmic     # | quadratic_reciprocal
  gamma: 0.5
  penalty_mult: 0.1
  delta: 1.0
  penalty_update: dimin_adapt    # | dimin | dimin_dual | const | aimd | alm
  gamma_annealing: false
  penalty_annealing: false
