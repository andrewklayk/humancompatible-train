# E3 (LM half) -- sparsity-constrained LM fine-tuning.
#
# Like the other adapters, this one drives its per-run function directly -- tune.py calls
# run_llm.train(), not run_llm.main(), so `algorithm.dual`'s `_target_` block is live and
# any constructor argument is sweepable. Sweep the dual through `algorithm.dual.*`.
#
# The consequence is that E3-LM tuning is SINGLE-RANK: main()'s torchrun re-exec is what a
# config object cannot cross, and train() sits underneath it. `ranks` must stay 1 here;
# raise `batch_size` to the effective batch of the multi-rank run you are tuning for, and
# use paper/e3/sweep.py for multi-rank runs themselves.

target: e3_llm

model: stub               # "stub" for the transformers-free stand-in, else a HF id
tokens: null              # defaults to <results>/e3/tokens.bin
synthetic: false          # write a random-token shard if `tokens` does not exist
vocab_size: null

eps: 0.7                  # target density
penalty: 1.0              # only used by method=penalty
granularity: block        # model | block | block_split
steps: 5000
warmup: 5
eval_batches: 16          # batches per rank per evaluation; 0 = the whole split

# train | val | test, as fractions of the shard. tune.py scores `val_ppl`; `test_ppl` is
# reported but nothing selects on it.
val_frac: 0.05
test_frac: 0.05
eval_every: 500           # steps between curve points; 0 = endpoints only
seq_len: 1024
batch_size: 16             # per rank
dtype: bfloat16
quick: false

# One submitit task per node, `ranks` GPUs beneath it -- run_llm re-execs torchrun itself.
# See conf/hydra/launcher/slurm_h200.yaml.
ranks: 1

# --- swept by conf/sweep/e3_llm_*.yaml ---
lr: 1.0e-4
gate_lr: 1.0e-2
# The dual's own hyperparameters live in conf/algorithm/<name>.yaml under `dual:` and are
# swept as `algorithm.dual.<key>`. There is no shared dual step size: it is `lr` for the
# alm_* methods, `beta` for ialm, `ki`/`kp` for nupi and `penalty_mult` for pbm, and the
# sweep names whichever one it varies.
grad_clip: 0.0
init_open: 0.95
