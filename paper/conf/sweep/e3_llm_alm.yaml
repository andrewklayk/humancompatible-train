# @package _global_
#
# The dual step is `experiment.dual_lr`, NOT `algorithm.dual.lr`: this adapter drives
# run_llm through argv (a DictConfig cannot cross its torchrun re-exec), so only
# `algorithm.method` is read from the algorithm group. See conf/experiment/e3_llm.yaml.
defaults:
  - override /experiment: e3_llm
  - override /algorithm: alm_hpr

hydra:
  sweeper:
    params:
      experiment.lr: choice(0.0001, 0.0005)
      experiment.gate_lr: choice(0.01, 0.05)
      experiment.dual_lr: choice(0.01, 0.05)
