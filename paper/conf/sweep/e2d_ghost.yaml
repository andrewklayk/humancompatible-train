# @package _global_
# E2d x Ghost grid (manual grid, BASIC sweeper). 3 * 2 * 2 * 2 = 24 configs.
# Add `seed=0,1,2` on the CLI to triple it.
defaults:
  - override /experiment: e2d
  - override /algorithm: ghost

hydra:
  sweeper:
    params:
      algorithm.ghost.gamma0: choice(0.1, 0.5, 0.9)
      algorithm.ghost.gamma_power: choice(0.6, 0.9)
      algorithm.ghost.tau: choice(0.1, 1.0)
      algorithm.ghost.rho: choice(0.1, 0.8)
