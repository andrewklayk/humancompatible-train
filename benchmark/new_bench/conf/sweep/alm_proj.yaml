# @package _global_
# ALM (projection form) hyperparameter grid for E1 (manual grid, BASIC sweeper).
# Full cartesian product: 5 * 5 * 2 * 2 = 100 configs (lr x dual.lr x penalty x mu).
defaults:
  - override /algorithm: alm_proj

hydra:
  sweeper:
    params:
      algorithm.primal.lr: choice(0.01)
      algorithm.dual.lr: choice(0.001, 0.005, 0.0001)
      algorithm.dual.penalty: choice(1.0)
      algorithm.moreau.mu: choice(1.0)